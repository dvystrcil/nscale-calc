# Grants argocd-image-updater-controller permission to read the
# nscale-calc-harbor-pull imagePullSecret in this namespace, so it can
# authenticate to Harbor when scanning for new image tags.
#
# Without this, the controller logs:
#   Could not fetch credentials: ... secrets "nscale-calc-harbor-pull"
#   is forbidden: User "system:serviceaccount:argocd:argocd-image-updater-controller"
#   cannot get resource "secrets" in API group "" in the namespace "nscale-calc"
#
# Lives in this CD repo because the controller's permissions into
# namespace X belong in X's repo, not in the controller's install
# (feedback_rbac_ownership).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-image-updater-secret-reader
  namespace: nscale-calc
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  resourceNames:
  - nscale-calc-harbor-pull
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-image-updater-secret-reader
  namespace: nscale-calc
subjects:
- kind: ServiceAccount
  name: argocd-image-updater-controller
  namespace: argocd
roleRef:
  kind: Role
  name: argocd-image-updater-secret-reader
  apiGroup: rbac.authorization.k8s.io
