apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nscale-calc
# The scaffold generates vpa.yaml but omits it from this list, and does not
# generate the Harbor pull secret or the image-updater RBAC at all — both
# added here to match the live tor-dice shape.
resources:
  - namespace.yaml
  - harbor-pull-secret.yaml
  - deployment.yaml
  - service.yaml
  - image-updater-rbac.yaml
  - vpa.yaml
